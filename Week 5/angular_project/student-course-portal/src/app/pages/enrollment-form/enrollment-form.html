<h1>Enrollment Request Form</h1>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <div>
    <label for="studentName">Student Name:</label>
    <input
      id="studentName"
      type="text"
      name="studentName"
      [(ngModel)]="studentName"
      #nameCtrl="ngModel"
      required
      minlength="3"
    />

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
      Name is required.
    </span>

    <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
      Name must be at least 3 characters.
    </span>
  </div>

  <br />

  <div>
    <label for="studentEmail">Email:</label>
    <input
      id="studentEmail"
      type="email"
      name="studentEmail"
      [(ngModel)]="studentEmail"
      #emailCtrl="ngModel"
      required
      email
    />

    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
      Email is required.
    </span>

    <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
      Enter a valid email address.
    </span>
  </div>

  <br />

  <div>
    <label for="courseId">Course ID:</label>
    <input
      id="courseId"
      type="number"
      name="courseId"
      [(ngModel)]="courseId"
      #courseCtrl="ngModel"
      required
    />

    <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
      Course ID is required.
    </span>
  </div>

  <br />

  <div>
    <label for="preferredSemester">Preferred Semester:</label>
    <select
      id="preferredSemester"
      name="preferredSemester"
      [(ngModel)]="preferredSemester"
      #semesterCtrl="ngModel"
      required
    >
      <option value="">Select a semester</option>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>

    <span *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">
      Select a semester.
    </span>
  </div>

  <br />

  <div>
    <label>
      <input
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        #termsCtrl="ngModel"
        required
      />
      I agree to the terms and conditions
    </label>

    <span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">
      You must agree to the terms.
    </span>
  </div>

  <br />

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>

  <button type="button" (click)="onReset(enrollForm)">
    Reset
  </button>
</form>

<div *ngIf="submitted">
  Enrollment request submitted successfully!
</div>

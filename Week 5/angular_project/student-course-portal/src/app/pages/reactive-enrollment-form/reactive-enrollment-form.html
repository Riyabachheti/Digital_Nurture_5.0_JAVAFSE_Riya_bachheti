<h1>Reactive Enrollment Form</h1>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="studentName">Student Name:</label>
    <input
      id="studentName"
      type="text"
      formControlName="studentName"
    />

    <span
      *ngIf="
        enrollForm.get('studentName')?.touched &&
        enrollForm.get('studentName')?.errors?.['required']
      "
    >
      Name is required.
    </span>

    <span
      *ngIf="
        enrollForm.get('studentName')?.touched &&
        enrollForm.get('studentName')?.errors?.['minlength']
      "
    >
      Name must be at least 3 characters.
    </span>
  </div>

  <br />

  <div>
    <label for="studentEmail">Email:</label>
    <input
      id="studentEmail"
      type="email"
      formControlName="studentEmail"
    />

    <span
      *ngIf="
        enrollForm.get('studentEmail')?.touched &&
        enrollForm.get('studentEmail')?.errors?.['required']
      "
    >
      Email is required.
    </span>

    <span
      *ngIf="
        enrollForm.get('studentEmail')?.touched &&
        enrollForm.get('studentEmail')?.errors?.['email']
      "
    >
      Enter a valid email address.
    </span>

    <span *ngIf="enrollForm.get('studentEmail')?.pending">
      Checking email...
    </span>

    <span
      *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']"
    >
      Email is already taken.
    </span>
  </div>

  <br />

  <div>
    <label for="courseId">Course Code:</label>
    <input
      id="courseId"
      type="text"
      placeholder="Example: CS101"
      formControlName="courseId"
    />

    <span
      *ngIf="
        enrollForm.get('courseId')?.touched &&
        enrollForm.get('courseId')?.errors?.['required']
      "
    >
      Course code is required.
    </span>

    <span
      *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']"
    >
      Course code starting with XX is not allowed.
    </span>
  </div>

  <br />

  <div>
    <label for="preferredSemester">Preferred Semester:</label>
    <select id="preferredSemester" formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <br />

  <div>
    <label>
      <input type="checkbox" formControlName="agreeToTerms" />
      I agree to the terms and conditions
    </label>

    <span
      *ngIf="
        enrollForm.get('agreeToTerms')?.touched &&
        enrollForm.get('agreeToTerms')?.invalid
      "
    >
      You must agree to the terms.
    </span>
  </div>

  <br />

  <div formArrayName="additionalCourses">
    <h3>Additional Courses</h3>

    <div *ngFor="let ctrl of additionalCourses.controls; let i = index">
        <input
            [formControlName]="i"
            placeholder="Additional course code"
        />

        <button type="button" (click)="removeCourse(i)">
            Remove
        </button>
    </div>

    <button type="button" (click)="addCourse()">
      Add Another Course
    </button>
  </div>

  <br />

  <button type="submit" [disabled]="enrollForm.invalid">
    Submit
  </button>
</form>

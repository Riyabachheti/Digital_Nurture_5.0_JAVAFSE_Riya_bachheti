<input
  type="text"
  placeholder="Search courses"
  [(ngModel)]="searchTerm"
  (ngModelChange)="onSearchChange()"
/>

<p *ngIf="loading$ | async">
  Loading courses...
</p>

<p *ngIf="error$ | async as error" class="error-message">
  {{ error }}
</p>

<div *ngIf="courses$ | async as courses">
  <div *ngIf="!loading$ || !(loading$ | async)">
    <div *ngIf="courses.length > 0; else noCourses">
      <app-course-card
        *ngFor="let c of courses; trackBy: trackByCourseId"
        [course]="c"
        [isEnrolled]="(enrolledIds$ | async)?.includes(c.id) ?? false"
        (enrollRequested)="onEnroll($event)"
        (click)="viewCourse(c.id)">
      </app-course-card>
    </div>
  </div>
</div>

<ng-template #noCourses>
  <p>No courses available.</p>
</ng-template>
